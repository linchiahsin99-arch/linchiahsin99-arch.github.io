<!-- 文章卡片：首頁「最新文章」和文章列表頁共用 -->
<a class="post-card" href="{{ include.post.url | relative_url }}">
  {% if include.post.image %}
  <img src="{{ include.post.image | relative_url }}" alt="{{ include.post.title }}">
  {% endif %}
  <div class="post-card-body">
    <span class="post-date">{{ include.post.date | date: "%Y.%m.%d" }}</span>
    <h3>{{ include.post.title }}</h3>
    <p>{% if include.post.description %}{{ include.post.description }}{% else %}{{ include.post.excerpt | strip_html | truncate: 80 }}{% endif %}</p>
    <span class="post-more">閱讀全文 →</span>
  </div>
</a>
